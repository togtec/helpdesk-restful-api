name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x mvnw

      - name: Executar testes e build
        run: ./mvnw clean verify

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build da imagem Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: helpdesk:ci

      - name: Exportar imagem Docker
        run: docker save helpdesk:ci -o helpdesk-ci.tar

      - name: Disponibilizar imagem para download
        uses: actions/upload-artifact@v4
        with:
          name: helpdesk-docker-image
          path: helpdesk-ci.tar