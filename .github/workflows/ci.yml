name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x mvnw

      - name: Executar testes e build
        run: ./mvnw clean verify

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Gerar metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.MGC_REGISTRY_REGION }}/${{ secrets.MGC_REGISTRY_NAME }}/helpdesk
          tags: |
            type=sha,format=short

      - name: Login no Magalu Cloud Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.MGC_REGISTRY_REGION }}
          username: ${{ secrets.MGC_REGISTRY_USER }}
          password: ${{ secrets.MGC_REGISTRY_PASSWORD }}

      - name: Build e push da imagem Docker
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Resumo da imagem publicada
        run: |
          echo "### Imagem Docker publicada :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imagem: ${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"