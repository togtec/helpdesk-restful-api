# DATASOURCE
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/helpdeskDB}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:helpdeskUser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

# JPA
# none/create/update -> cria/recria as tabelas no banco de dados
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true